[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "booking-control"
version = "2.0.0"
description = "Web noi bo quan ly Export Shipment & Booking: luoi Follow Up 47 cot giong Excel, phan quyen Admin/Quan ly/Nguoi dung, phan cong lo hang, xuat Excel, Automation Engine (deadline, Planning, HS Code, Outlook)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JM" }]
keywords = ["logistics", "export", "booking", "excel", "automation", "shipping"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Office/Business",
]

dependencies = [
    "openpyxl>=3.1.2",
    "lxml>=5.0.0",
    "SQLAlchemy>=2.0.25",
    "pydantic>=2.5.0",
    "PyYAML>=6.0.1",
    "APScheduler>=3.10.4",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.7",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "portalocker>=2.8.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "freezegun>=1.4.0",
    "ruff>=0.2.0",
    "pyinstaller>=6.3.0",
]

[project.scripts]
bookingctl = "booking_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
booking_control = ["web/templates/*.html", "web/static/*", "web/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
