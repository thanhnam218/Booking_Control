# =============================================================================
# BOOKING CONTROL - CAU HINH CHINH
# =============================================================================
# Copy file nay thanh config/config.yaml roi sua theo moi truong cua ban.
#   PowerShell:  Copy-Item config\config.example.yaml config\config.yaml
# File config.yaml da nam trong .gitignore (vi chua duong dan noi bo cong ty).
# =============================================================================

app:
  name: "Booking Control"
  timezone: "Asia/Ho_Chi_Minh"
  language: "vi"
  # Thu muc luu DB / log / backup. Mac dinh: %LOCALAPPDATA%\BookingControl
  data_dir: "./data"
  log_level: "INFO"

database:
  # SQLite cho 1 may / it user. Doi sang SQL Server khi nhieu user dung chung.
  url: "sqlite:///./data/booking_control.db"
  # url: "mssql+pyodbc://user:pass@SERVER/BookingControl?driver=ODBC+Driver+17+for+SQL+Server"
  echo: false

# -----------------------------------------------------------------------------
# NGUOI DUNG  (SRS muc 58-59)
# -----------------------------------------------------------------------------
users:
  # CHI DUNG DE TAO SAN tai khoan lan dau (chua co mat khau).
  # Sau do Admin quan ly tren web: Quan tri > Nguoi dung (dat mat khau tam, doi vai tro, khoa).
  # role: admin (quan tri) | manager (quan ly) | user (nguoi dung) | viewer (chi xem)
  - name: "admin"
    display_name: "Quan tri he thong"
    email: "admin@company.com"
    role: "admin"
  - name: "manager"
    display_name: "Truong nhom Logistics"
    email: "manager@company.com"
    role: "manager"
  - name: "user_a"
    display_name: "Nguyen Van A"
    email: "a@company.com"
    role: "user"
  - name: "user_b"
    display_name: "Tran Thi B"
    email: "b@company.com"
    role: "user"
  - name: "user_c"
    display_name: "Le Van C"
    email: "c@company.com"
    role: "user"

# -----------------------------------------------------------------------------
# PHAN CONG TU DONG (chi ap dung cho lo MOI chua co nguoi phu trach)
# -----------------------------------------------------------------------------
# Thu tu: rule dau tien khop -> giao; khong khop rule nao -> giao cho chu file Follow Up
# (use_file_owner); van khong co -> "Chua phan cong" de Quan ly giao tay.
# Automation KHONG BAO GIO doi nguoi phu trach ma Quan ly da giao.
assignment:
  auto_assign_new: true
  use_file_owner: true
  rules:
    - { buyer: ["SAMSUNG"], user: "user_b", backup: "user_a" }
    # - { buyer: ["ABC"], mode: ["AIR"], user: "user_c" }
    # - { forwarder: ["DHL"], user: "user_a" }

# -----------------------------------------------------------------------------
# FILE REGISTRY  (DMS muc 2)
# -----------------------------------------------------------------------------
# role:
#   follow_up         F01 - nguon chinh, moi user 1 file
#   weekly_planning   F02 - dich, T-7
#   custom_code       F03 - dich, T-7
#   mm_daily          F04 - dich
#   shipping_schedule F05 - dich, T-1 (TDV/TGV)
#
# LUU Y OneDrive/SharePoint: dung duong dan da sync ve may (C:\Users\...\OneDrive - Cong ty\...)
# thay vi URL. Automation ghi vao file local, OneDrive tu dong sync len cloud.
files:

  - id: "F01-A"
    role: "follow_up"
    display_name: "Follow Up - Nguyen Van A"
    path: "./sample_data/FollowUp_UserA.xlsx"
    owner: "user_a"
    storage: "local"      # local | onedrive | sharepoint
    read: true
    write: true           # Automation duoc to mau dong tren file nay

  - id: "F01-B"
    role: "follow_up"
    display_name: "Follow Up - Tran Thi B"
    path: "./sample_data/FollowUp_UserB.xlsx"
    owner: "user_b"
    storage: "local"
    read: true
    write: true

  # File Follow Up theo DUNG cau truc that (47 cot, cot NO la cong thuc, CONT TYPE merge)
  - id: "F01-C"
    role: "follow_up"
    display_name: "Follow Up - Le Van C (cau truc that)"
    path: "./sample_data/FollowUp_UserC_CauTrucThat.xlsx"
    owner: "user_c"
    storage: "local"
    read: true
    write: true
    # Cot A (NO) la cong thuc, User to vang de danh dau -> Automation khong to de mau cot nay
    color_skip_columns: ["A"]

  - id: "F02"
    role: "weekly_planning"
    display_name: "WEEKLY PLANNING 2026"
    path: "./sample_data/WEEKLY_PLANNING_2026.xlsx"
    sheet: "2026"                 # de trong = tu dong tim sheet co header khop
    header_row: 1                 # de trong = tu dong do
    owner: "common"
    storage: "local"
    read: true
    write: true

  - id: "F03"
    role: "custom_code"
    display_name: "Custom Code"
    path: "./sample_data/CUSTOM_CODE.xlsx"
    sheet: "HS CODE"
    header_row: 1
    owner: "common"
    storage: "local"
    read: true
    write: true

  - id: "F04"
    role: "mm_daily"
    display_name: "MM-DAILY PLANNING SEP 2026 (GV)"
    path: "./sample_data/MM_DAILY_PLANNING_SEP_2026_GV.xlsx"
    sheet: "DAILY"
    header_row: 1
    owner: "common"
    storage: "local"
    read: true
    write: true

  - id: "F05"
    role: "shipping_schedule"
    display_name: "Lich xuat hang - IP (DV)"
    path: "./sample_data/LICH_XUAT_HANG_IP_DV.xlsx"
    # File nay co 2 sheet cho 2 co so
    sheets_by_site:
      TDV: "TDV"        # Co so 2
      TGV: "TGV"        # Co so 1
    header_row: 1
    owner: "common"
    storage: "local"
    read: true
    write: true

# Quy tac xac dinh shipment thuoc co so nao (SRS muc 26)
# order: kiem tra lan luot tu tren xuong; khong khop -> default_site
site_rules:
  default_site: "TGV"
  rules:
    - when: { field: "PIC", in: ["Nguyen Van A", "user_a"] }
      site: "TGV"
    - when: { field: "PIC", in: ["Tran Thi B", "user_b"] }
      site: "TDV"
    - when: { field: "Buyer", in: ["IKEA"] }
      site: "TDV"
    - when: { field: "PIC", in: ["Le Van C", "user_c"] }
      site: "TGV"

# -----------------------------------------------------------------------------
# SCHEDULER  (SRS muc 42-43)
# -----------------------------------------------------------------------------
scheduler:
  scan_interval_hours: 3        # cho phep 1-4
  scan_anchor_hour: 9           # moc bat dau: 09:00, 12:00, 15:00, 18:00...
  run_on_start: true
  notification_window:
    start: "08:00"
    end: "16:00"
  active_weekdays: ["mon", "tue", "wed", "thu", "fri", "sat"]
  # Ngoai gio thong bao: Automation van scan, nhung don thong bao lai va ban ngay hom sau
  queue_outside_window: true

# -----------------------------------------------------------------------------
# DEADLINE / REMINDER  (SRS muc 44-46)
# -----------------------------------------------------------------------------
deadlines:
  booking_window:
    start_days_before: 20       # T-20 bat dau nhac
    end_days_before: 14         # T-14 het cua so -> nang len CRITICAL
  hold_reminder_days: 3         # cho phep 1-7
  milestones:
    weekly_planning_days_before: 7    # T-7
    custom_code_days_before: 7        # T-7
    final_info_days_before: 3         # T-3
    shipping_schedule_days_before: 1  # T-1
  # Chong spam: cung 1 shipment + cung 1 loai thong bao chi ban lai sau N gio
  dedup_hours: 20
  # Thong bao cho ca shipment da qua han (ExFtyDate < hom nay) bao nhieu ngay
  overdue_grace_days: 3

# -----------------------------------------------------------------------------
# CONTAINER ENGINE  (SRS muc 15-19)
# -----------------------------------------------------------------------------
container:
  capacity:
    "40HC": 63
    "40DC": 53
    "20ST": 23
  priority: ["40HC", "40DC", "20ST"]
  # priority  = greedy theo thu tu uu tien (dung nhu vi du 160 CBM -> 2x40HC + 1x40DC)
  # min_excess = tim to hop du thua it nhat (co the ra ket qua khac SRS)
  strategy: "priority"
  # CBM <= nguong nay va ShipMode=SEA -> de xuat LCL/CFS thay vi FCL
  lcl_threshold_cbm: 15
  # He so an toan: capacity phai >= CBM * safety_factor
  safety_factor: 1.0
  air_type: "AC"
  lcl_type: "CFS"

# -----------------------------------------------------------------------------
# STATUS ENGINE  (SRS muc 27-33)
# -----------------------------------------------------------------------------
status:
  colors:
    WHITE:     "FFFFFFFF"
    YELLOW:    "FFFFFF00"
    GREEN:     "FF92D050"    # Light Green
    RED:       "FFFF0000"
    COMPLETED: "FF00B0F0"    # Xanh duong - da xuat xong
    PARTIAL:   "FFFFC000"    # Cam - xuat mot phan
    CANCELLED: "FFBFBFBF"    # Xam - da huy
  # Mau tu dinh nghia (SRS: "cac mau con lai co the gan thong bao theo y tung nguoi")
  custom:
    - name: "URGENT_DOC"
      color: "FFFF00FF"
      label: "Gap chung tu"
      notify: true
    - name: "WAIT_CUSTOMER"
      color: "FF7030A0"
      label: "Cho khach xac nhan"
      notify: false
  # Automation co duoc phep to mau truc tiep len file Follow Up khong
  # (ghi LOSSLESS: chi doi mau o, giu nguyen cong thuc / external link / defined name)
  write_color_to_excel: true
  # Doc mau User to tay trong Excel -> coi nhu User chot trang thai (USER > AUTO)
  #   to DO  -> RED (hold) | to VANG -> YELLOW | to dung mau Automation -> tra lai cho Automation
  #   mau la (khong co trong bang) -> Automation khong to de dong do
  read_user_colors: true
  # Khi nao coi la DA XUAT XONG (COMPLETED)
  completed_rule:
    enabled: true
    require_container_seal: true   # hang FCL phai co CONT + SEAL
    require_etd_passed: true       # ETD (ngay tau chay) da qua
    group_partial: true            # nhom cung NO co dong da dong cont, co dong chua -> PARTIAL

# -----------------------------------------------------------------------------
# KHOA LO HANG
# -----------------------------------------------------------------------------
shipment:
  # NO trong file that la CONG THUC tu INVOICE (chua co invoice -> NO trong).
  # false = khoa chi gom JO + ExFtyDate -> lo khong bi tach doi khi invoice xuat hien.
  key_includes_no: false

# -----------------------------------------------------------------------------
# GHI FILE EXCEL - AN TOAN DU LIEU  (SRS muc 37-41, 54)
# -----------------------------------------------------------------------------
excel_write:
  dry_run_default: false        # true = khong bao gio ghi that, chi bao cao
  backup_before_write: true
  backup_keep_versions: 20
  conflict_policy: "stop"       # stop | queue  (KHONG BAO GIO overwrite)
  lock_retry_seconds: [30, 60, 120]
  pending_queue_max_age_hours: 72
  verify_after_write: true      # doc lai de xac nhan da ghi dung

# -----------------------------------------------------------------------------
# THONG BAO  (SRS muc 49-51)
# -----------------------------------------------------------------------------
notification:
  channels:
    web: true                   # chuong thong bao + Desktop Notification trong trinh duyet
    email: false                # bat khi da cau hinh SMTP ben duoi
    console: true
  severity_to_channel:
    CRITICAL: ["web", "email"]
    WARNING:  ["web"]
    INFO:     ["web"]
  group_warnings: true
  # Gui email cho nguoi phu trach lo hang (tuy chon)
  email:
    enabled: false
    smtp_host: "smtp.company.local"
    smtp_port: 25
    use_tls: false
    username: ""
    password_env: "BOOKINGCTL_SMTP_PASSWORD"   # mat khau dat trong bien moi truong, KHONG ghi o day
    sender: "booking-control@company.com"
    always_cc: []
    base_url: "http://192.168.1.20:8765"       # dia chi may chu de chen link vao email

# -----------------------------------------------------------------------------
# WEB NOI BO
# -----------------------------------------------------------------------------
web:
  enabled: true
  # "127.0.0.1" = chi dung tren may nay.
  # "0.0.0.0"   = may chu noi bo: dong nghiep cung mang LAN mo http://<IP-may-chu>:8765
  host: "127.0.0.1"
  port: 8765
  open_browser_on_start: false
  grid_page_size: 2000          # so dong toi da tren luoi Follow Up moi lan tai (loc de xem them)

# -----------------------------------------------------------------------------
# DANG NHAP
# -----------------------------------------------------------------------------
auth:
  session_hours: 12
  remember_days: 14
  min_password_length: 8
  max_failed_logins: 5          # sai 5 lan -> khoa tam 10 phut (theo ten + IP)
  lockout_minutes: 10
  allow_remote_setup: false     # trang tao Admin dau tien chi mo tren chinh may chu
  secure_cookie: false          # dat true neu chay sau HTTPS (IIS / nginx reverse proxy)

# -----------------------------------------------------------------------------
# TAC VU TU DONG (Automation Engine)
# -----------------------------------------------------------------------------
jobs:
  max_retries: 2                # vd Outlook mat ket noi -> thu lai 2 lan
  retry_backoff_seconds: 30
  keep_days: 60
  outlook_interval_minutes: 30

# -----------------------------------------------------------------------------
# OUTLOOK DESKTOP (SRSv5 muc 19-27) - may chu phai cai Outlook va dang mo hop thu
# Phan loai / ghep lo / diem tin cay: config/email_profiles.yaml
# -----------------------------------------------------------------------------
outlook:
  enabled: false                # bat len khi chay tren may chu co Outlook desktop + pywin32
  mailbox: ""                   # de trong = hop thu mac dinh; hoac ten hop thu dung chung "booking@company.com"
  folders: ["Inbox", "Sent Items"]   # Sent Items: email yeu cau booking minh gui -> nho Conversation
  lookback_days: 14             # lan dau doc lui 14 ngay; sau do chi doc email moi
  max_items: 500                # toi da moi thu muc / lan quet
  attachment_exts: [".pdf", ".xlsx", ".xls", ".docx"]
  max_attachment_mb: 15
  body_chars: 6000              # chi luu doan dau than email
  # true: email du diem (>= 85) va email/PDF khong mau thuan -> tu cap nhat booking + lo hang
  # false: moi email vao hang cho duyet (trang Email), nguoi dung bam Ap dung
  auto_apply: true

# -----------------------------------------------------------------------------
# CHUNG TU (SRSv5 muc 56-57) - luu file ngoai database, khong ghi de version cu
# -----------------------------------------------------------------------------
documents:
  root: ""                      # de trong = <data_dir>/documents; co the dat o NAS: "\\\\server\\share\\docs"
  max_upload_mb: 25
  allowed_exts: [".pdf", ".xlsx", ".xls", ".xlsm", ".docx", ".doc", ".png", ".jpg", ".jpeg", ".zip", ".msg", ".eml"]

# -----------------------------------------------------------------------------
# WEEKLY PLANNING - phai xong truoc 12:00 thu 6 (SRSv5 muc 36)
# -----------------------------------------------------------------------------
weekly_planning:
  enabled: true
  include_next_week_from: "thu"  # tu thu 5: Weekly Planning ghi luon cac lo cua tuan sau
  deadline: "fri 12:00"
  reminders:
    - { at: "thu 08:00", level: INFO }
    - { at: "fri 08:00", level: WARNING }
    - { at: "fri 11:00", level: CRITICAL }
