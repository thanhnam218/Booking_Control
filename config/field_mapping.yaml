# =============================================================================
# DATA DICTIONARY  -  Canonical Field  <->  Header thuc te trong Excel
# =============================================================================
# Day la "trai tim" cua he thong (DMS muc 4-5). KHONG hard-code cot A/B/C trong
# source code. Automation doc file nay de hieu header cua tung sheet Follow Up.
#
# Cach hoat dong:
#   1. Automation doc dong header cua sheet.
#   2. Chuan hoa chuoi (bo dau cach, ky tu dac biet, viet thuong).
#   3. So khop voi `aliases` -> confidence = 100%.
#   4. Neu khong khop chinh xac -> fuzzy match. Confidence >= fuzzy_accept
#      thi nhan, tu fuzzy_review den fuzzy_accept thi hoi User xac nhan,
#      duoi fuzzy_review thi bo qua.
#   5. Mapping da duoc User xac nhan se duoc luu vao DB (bang column_mappings)
#      va uu tien hon file YAML nay.
# =============================================================================

version: 1

matching:
  fuzzy_accept: 0.88      # >= : tu dong nhan
  fuzzy_review: 0.65      # >= : dua vao Exception Center cho User xac nhan
  case_sensitive: false

# Nguong nhan dien mot sheet la "Follow Up" (SRS muc 6)
sheet_detection:
  # Bat buoc phai co it nhat ngan nay truong trong nhom `required_any`
  min_required_hits: 3
  # Diem tin cay toi thieu de tu dong scan
  auto_accept_confidence: 0.80
  # Duoi muc nay -> bo qua han
  ignore_below_confidence: 0.35
  required_any:
    - ShipmentNo
    - ExFtyDate
    - JO
    - FinalCBM
    - Invoice
    - FinalExportQty
  # Sheet co ten khop cac pattern nay se bi bo qua ngay (khong ton thoi gian)
  ignore_sheet_patterns:
    - "^summary$"
    - "^report$"
    - "^data$"
    - "^template$"
    - "^note"
    - "^huong dan"
    - "^sheet[0-9]*$"
  # Toi da bao nhieu dong dau tien duoc do tim dong header
  header_search_rows: 15

