# -----------------------------------------------------------------------------
# TRUONG SUY RA TU CONG THUC EXCEL
# -----------------------------------------------------------------------------
# Tai tao dung cong thuc cua file that. Dung cho 2 viec:
#   1. Fallback: o NO khong co gia tri tinh san (file bi luu boi cong cu khac,
#      chua mo lai bang Excel) -> Automation tu tinh NO tu INVOICE, khong bo trong.
#   2. Doi chieu: NO trong file khac voi ket qua cong thuc -> co nguoi go de
#      len cong thuc -> Exception EX013.
# -----------------------------------------------------------------------------
derived_fields:
  ShipmentNo:
    source: Invoice
    rule: invoice_suffix
    prefix: "TEGV"          # LEFT(INVOICE,4)="TEGV"
    last_digits: 5          # RIGHT(INVOICE,5)
    offset: -2108           # -2108
    excel_formula: '=IF(LEFT(INVOICE,4)="TEGV",RIGHT(INVOICE,5)-2108,"")'

# -----------------------------------------------------------------------------
# TU KHOA TRONG CO REMARK
# -----------------------------------------------------------------------------
# File that khong co cot HOLD / CANCEL. Neu REMARK chua tu khoa duoi day va file
# khong co cot tuong ung -> Automation hieu la HOLD / CANCEL. Phan con lai cua REMARK
# duoc dung lam ly do hold.
remark_keywords:
  hold: ["HOLD", "TAM DUNG", "GIU HANG", "ON HOLD", "CHO KHACH"]
  cancel: ["CANCEL", "HUY BOOK", "HUY BOOKING", "DA HUY"]
  # tu khoa phu dinh -> KHONG tinh la hold (vd "UNHOLD", "RELEASE HOLD")
  hold_negations: ["UNHOLD", "UN-HOLD", "RELEASE", "HET HOLD", "BO HOLD"]

# -----------------------------------------------------------------------------
# VALUE NORMALIZATION - chuan hoa GIA TRI (khong phai ten cot)
# -----------------------------------------------------------------------------
value_maps:

  ship_mode:
    AIR: ["AIR", "Air", "A", "By Air", "AIRFREIGHT", "Air Freight", "MAY BAY", "HANG KHONG"]
    SEA: ["SEA", "Sea", "S", "By Sea", "OCEAN", "Vessel", "TAU", "DUONG BIEN"]
    EXPRESS: ["EXPRESS", "DHL", "FEDEX", "UPS", "COURIER", "CHUYEN PHAT"]

  truthy:
    - "YES"
    - "Y"
    - "TRUE"
    - "1"
    - "X"
    - "V"
    - "OK"
    - "DONE"
    - "CO"
    - "DA BOOK"
    - "BOOKED"
  falsy:
    - "NO"
    - "N"
    - "FALSE"
    - "0"
    - "-"
    - "NA"
    - "N/A"
    - "KHONG"
    - "CHUA"
    - "PENDING"

  # Cac gia tri duoc coi la O TRONG (khi kiem tra CDF / BL)
  blank_equivalents:
    - ""
    - "-"
    - "--"
    - "N/A"
    - "NA"
    - "NONE"
    - "TBA"
    - "TBC"
    - "PENDING"
    - "WAITING"
    - "CHUA CO"
    - "?"

# Thu tu uu tien khi parse ngay (SRS/DMS muc 7). day_first = dinh dang VN.
date_parsing:
  day_first: true
  formats:
    - "%d/%m/%Y"
    - "%d-%m-%Y"
    - "%d.%m.%Y"
    - "%Y-%m-%d"
    - "%Y/%m/%d"
    - "%m/%d/%Y"
    - "%d/%m/%y"
    - "%d-%b-%Y"
    - "%d %b %Y"
    - "%b %d, %Y"
  canonical: "%Y-%m-%d"

# =============================================================================
# QUAN HE JO - GO  (SRSv5.1 muc 5)
# =============================================================================
# Mot GO co the gom nhieu JO. He thong nhan ra bang PHAN MA GOC dung chung:
#
#     JO 26V02426KR01 ─┐
#                      ├─ ma goc 26V02426 ─ GO S26V02426
#     JO 26V02426KR02 ─┘
#
# Hai bieu thuc duoi day tach phan ma goc ra khoi JO va GO. Phai co nhom (?P<core>...).
# Cong ty danh ma kieu khac thi sua o day, KHONG sua code.
#
#   jo_pattern  mac dinh: bo duoi <2 chu nuoc><1-3 so>   26V02426KR01 -> 26V02426
#   go_pattern  mac dinh: bo 1 chu cai dau neu co        S26V02426    -> 26V02426
#
# Ma goc ngan hon min_core_len thi bo qua - tha khong noi con hon noi nham.
jo_go:
  jo_pattern: '^(?P<core>.+?)[A-Z]{2}\d{1,3}$'
  go_pattern: '^[A-Z]?(?P<core>.+)$'
  min_core_len: 4
